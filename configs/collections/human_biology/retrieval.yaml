# Retrieval for the human_biology collection (app only, not evaluated): the APP index (structural chunks, bge-small embeddings, the
# fastest encoder on this CPU and the best dev retriever of cs_ai). index: app makes every
# evaluation script refuse these settings.

index: app

paths:
  processed_dir: collections/human_biology/processed
  emb_dir: collections/human_biology/processed/emb
  chroma_dir: collections/human_biology/processed/chroma
  results_dir: collections/human_biology/results
  questions: collections/human_biology/eval/questions.jsonl

seed: 42
device: cpu
embed_batch_size: 16
rerank_batch_size: 16
query_instruction: "Represent this sentence for searching relevant passages: "

dense_models:
  bge-small: BAAI/bge-small-en-v1.5
rerankers:
  minilm: cross-encoder/ms-marco-MiniLM-L-6-v2

defaults:
  chunker: structural
  retriever: dense
  dense_model: bge-small
  query_instruction: true
  bm25_k1: 1.5
  bm25_b: 0.75
  bm25_stem: false
  rrf_k: 60
  alpha: 0.5
  first_stage_k: 50
  xref_expand: false
  xref_top_m: 5
  xref_max_added: 10
  xref_per_target: 1
  rerank: false
  rerank_model: minilm
  rerank_n: 20
  final_k: 10

selection:
  baselines:
    naive_rag: "structural|dense|bge-small"
  reference_baseline: naive_rag
  min_answerable_for_test: 20
