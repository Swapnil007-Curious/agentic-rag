# Retrieval for the cs_ai collection: reduced grid (16 configs), bge-small and bge-base only.

paths:
  processed_dir: collections/cs_ai/processed
  emb_dir: collections/cs_ai/processed/emb
  chroma_dir: collections/cs_ai/processed/chroma
  results_dir: collections/cs_ai/results
  questions: collections/cs_ai/eval/questions.jsonl

seed: 42
device: cpu
embed_batch_size: 16
rerank_batch_size: 16
query_instruction: "Represent this sentence for searching relevant passages: "

dense_models:
  bge-small: BAAI/bge-small-en-v1.5
  bge-base: BAAI/bge-base-en-v1.5
rerankers:
  minilm: cross-encoder/ms-marco-MiniLM-L-6-v2

defaults:
  chunker: structural
  retriever: hybrid_rrf
  dense_model: bge-base
  query_instruction: true
  bm25_k1: 1.5
  bm25_b: 0.75
  bm25_stem: false
  rrf_k: 60
  alpha: 0.5
  first_stage_k: 50
  xref_expand: false
  xref_top_m: 5
  xref_max_added: 10
  xref_per_target: 1
  rerank: false
  rerank_model: minilm
  rerank_n: 20
  final_k: 10

eval:
  ks: [1, 3, 5, 10]
  budgets: [512, 1024, 2048]
  bootstrap_resamples: 1000
  seed: 42

# chunker {fixed_512, structural} x retriever {bm25, dense bge-small, dense bge-base,
# hybrid_rrf bm25+bge-base} x rerank {off, minilm}; xref_expand off -> 16 configs
grid:
  - chunkers: [fixed_512, structural]
    retrievers:
      - {retriever: bm25}
      - {retriever: dense, dense_model: bge-small}
      - {retriever: dense, dense_model: bge-base}
      - {retriever: hybrid_rrf, dense_model: bge-base}
    xref_expand: [false]
    rerank: [false, true]
    rerank_model: minilm

selection:
  baselines:
    naive_rag: "fixed_512|dense|bge-base"
    bm25: "fixed_512|bm25"
  reference_baseline: naive_rag
  min_answerable_for_test: 20
