# Ingestion for the cs_ai collection: selected chapters of three open-licensed textbooks.
# doc_type "textbook" + parser "generic": chapter selection by title (PDF outline, else heading
# detection), textbook cleaning (code blocks, running headers, exercises/references dropped),
# numbered-heading node IDs (<doc>:5.1.2) and Section/Chapter/Fig. cross-references.
# The licence is read from each PDF's licence page; `licence` below is used (and marked as
# such in SOURCES.csv) only when the PDF does not state one with a version.

paths:
  raw_dir: collections/cs_ai/raw
  processed_dir: collections/cs_ai/processed

sources_format: textbook        # SOURCES.csv with authors, edition, licence and chapters

documents:
  - file: d2l.pdf
    doc_id: d2l
    title: "Dive into Deep Learning"
    doc_type: textbook
    parser: generic
    authors: "Aston Zhang, Zachary C. Lipton, Mu Li, Alexander J. Smola"
    edition: "PyTorch edition, PDF built 2023-08-18"
    downloaded_on: "2026-11-11"
    source_url: "https://d2l.ai/d2l-en.pdf"
    licence: "CC BY-SA 4.0 International"
    licence_url: "https://creativecommons.org/licenses/by-sa/4.0/"
    licence_note: "book text licence from the d2l-en repository README (https://github.com/d2l-ai/d2l-en); its sample code is under a modified MIT licence"
    chapters:
      - "Multilayer Perceptrons"
      - "Convolutional Neural Networks"
      - "Recurrent Neural Networks"
      - "Attention Mechanisms and Transformers"
      - "Optimization Algorithms"

  - file: progit.pdf
    doc_id: progit
    title: "Pro Git"
    doc_type: textbook
    parser: generic
    authors: "Scott Chacon, Ben Straub"
    edition: "Second edition, version 2.1.450 (2026-05-25)"
    downloaded_on: "2026-11-11"
    source_url: "https://git-scm.com/book/en/v2"
    licence: "CC BY-NC-SA 3.0 Unported"
    licence_url: "https://creativecommons.org/licenses/by-nc-sa/3.0/"
    chapters:
      - "Getting Started"
      - "Git Basics"
      - "Git Branching"

  - file: ods.pdf
    doc_id: ods
    title: "Open Data Structures (in pseudocode)"
    short_title: "Open Data Structures"
    doc_type: textbook
    parser: generic
    authors: "Pat Morin"
    edition: "Edition 0.1G-beta (pseudocode)"
    downloaded_on: "2026-11-11"
    source_url: "https://opendatastructures.org/"
    licence: "CC BY 2.5 Canada"
    licence_url: "https://creativecommons.org/licenses/by/2.5/ca/"
    licence_note: "version from the licence link on https://opendatastructures.org/"
    chapters:
      - "Array-Based Lists"
      - "Linked Lists"
      - "Hash Tables"
      - "Binary Trees"
      - "Heaps"
      - "Sorting Algorithms"
      - "Graphs"
    pseudocode_by_indent: true      # pseudocode is set in the text font, indented
    # running headers "§2.1 Array-Based Lists" / "ArrayStack: ... §2.1" carry no page number
    header_footer_patterns:
      - '^§\d+(?:\.\d+)*\s+\S.*$'
      - '^\S.*\s+§\d+(?:\.\d+)*$'

cleaning:
  page_number_band: 0.12
  footnote_max_size_ratio: 0.90
  paragraph_gap_ratio: 0.35
  toc_markers: []
  drop_line_patterns:
    - '^Discussions\s*\^?\d*\.?$'     # d2l forum links at the end of each section
    - '^\(continue[sd] (?:on next|from previous) page\)$'   # d2l code-listing markers

textbook:
  heading_size_delta: 0.8
  code_min_mono_fraction: 0.8
